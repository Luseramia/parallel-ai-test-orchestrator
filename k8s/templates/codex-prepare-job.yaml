# Reference copy of the Job the gateway POSTs for the prepare phase. The
# gateway builds this in code (gateway/app/services/kubernetes_launcher.py);
# gateway/tests/test_k8s_manifests.py fills in the placeholders below and
# asserts the two are identical, so this file cannot drift silently.
#
# Prepare and generate Jobs are the only workloads that receive the model
# credential, and no runner Job ever receives a Kubernetes API token.
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: ai-test-runners
  labels:
    app.kubernetes.io/name: parallel-ai-test-runner
    app.kubernetes.io/component: prepare
    ai-test.openai.com/job-id: __JOB_ID__
spec:
  backoffLimit: 0
  activeDeadlineSeconds: __ACTIVE_DEADLINE_SECONDS__
  ttlSecondsAfterFinished: __TTL_SECONDS__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parallel-ai-test-runner
        app.kubernetes.io/component: prepare
        ai-test.openai.com/job-id: __JOB_ID__
    spec:
      serviceAccountName: codex-runner
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: __CODEX_RUNNER_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["node", "/runner/dist/src/prepare.js"]
          env:
            - name: JOB_ID
              value: __JOB_ID__
            - name: TASK_ID
              value: __TASK_ID__
            - name: GIT_CLONE_URL
              value: __CLONE_URL__
            - name: BASE_SHA
              value: __BASE_SHA__
            - name: ATTEMPT
              value: "__ATTEMPT__"
            - name: ARTIFACT_ROOT
              value: /artifacts
            - name: GATEWAY_URL
              value: __GATEWAY_URL__
            - name: ARTIFACT_GATEWAY_URL
              value: __ARTIFACT_GATEWAY_URL__
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: __CODEX_CALLBACK_SECRET__
                  key: token
            - name: PLAN_PATH
              value: /artifacts/input/test-plan.json
            - name: PLAN_OBJECT_KEY
              value: __PLAN_OBJECT_KEY__
            - name: OUTPUT_SCHEMA
              value: /contracts/test-draft.schema.json
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: __CODEX_SECRET__
                  key: api-key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
