# Reference copy of the Job the gateway POSTs for the generate phase, kept
# identical to gateway/app/services/kubernetes_launcher.py by
# gateway/tests/test_k8s_manifests.py.
#
# The tested commit is pinned twice: as an annotation for operators and as
# CODE_SHA for the runner. Nothing here can select a branch tip.
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: ai-test-runners
  labels:
    app.kubernetes.io/name: parallel-ai-test-runner
    app.kubernetes.io/component: generate
    ai-test.openai.com/job-id: __JOB_ID__
  annotations:
    ai-test.openai.com/code-sha: __CODE_SHA__
spec:
  backoffLimit: 0
  activeDeadlineSeconds: __ACTIVE_DEADLINE_SECONDS__
  ttlSecondsAfterFinished: __TTL_SECONDS__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parallel-ai-test-runner
        app.kubernetes.io/component: generate
        ai-test.openai.com/job-id: __JOB_ID__
    spec:
      serviceAccountName: codex-runner
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: __CODEX_RUNNER_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["node", "/runner/dist/src/generate-tests.js"]
          env:
            - name: JOB_ID
              value: __JOB_ID__
            - name: TASK_ID
              value: __TASK_ID__
            - name: GIT_CLONE_URL
              value: __CLONE_URL__
            - name: BASE_SHA
              value: __BASE_SHA__
            - name: ATTEMPT
              value: "__ATTEMPT__"
            - name: ARTIFACT_ROOT
              value: /artifacts
            - name: GATEWAY_URL
              value: __GATEWAY_URL__
            - name: ARTIFACT_GATEWAY_URL
              value: __ARTIFACT_GATEWAY_URL__
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: __CODEX_CALLBACK_SECRET__
                  key: token
            - name: CODE_SHA
              value: __CODE_SHA__
            - name: PLAN_PATH
              value: /artifacts/input/test-plan.json
            - name: PLAN_OBJECT_KEY
              value: __PLAN_OBJECT_KEY__
            - name: DRAFT_PATH
              value: /artifacts/input/test-draft.json
            - name: DRAFT_OBJECT_KEY
              value: __DRAFT_OBJECT_KEY__
            - name: PATCH_POLICY_JSON
              value: '__PATCH_POLICY_JSON__'
            - name: OUTPUT_SCHEMA
              value: /contracts/generation-result.schema.json
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: __CODEX_SECRET__
                  key: api-key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
