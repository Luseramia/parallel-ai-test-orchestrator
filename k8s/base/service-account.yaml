# The gateway is the only identity that may talk to the Kubernetes API. Runner
# ServiceAccounts exist to own Pod identity and quota, never to call the API:
# they hold no RBAC rules and never receive a projected API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: ai-test-system
  labels:
    app.kubernetes.io/name: parallel-ai-test-gateway
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codex-runner
  namespace: ai-test-runners
  labels:
    app.kubernetes.io/name: parallel-ai-test-runner
    app.kubernetes.io/component: codex
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-runner
  namespace: ai-test-runners
  labels:
    app.kubernetes.io/name: parallel-ai-test-runner
    app.kubernetes.io/component: test
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
automountServiceAccountToken: false
