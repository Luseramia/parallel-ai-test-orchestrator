# Periodic cleanup and reconciliation. It times out jobs whose runner died
# without a callback, deletes finished Kubernetes Jobs the gateway still holds
# a name for, retries pending notifications and purges artifact bytes past
# retention. It reuses the gateway ServiceAccount because it needs exactly the
# same Job lifecycle rights and nothing more, and it carries the gateway name
# label so the gateway-egress NetworkPolicy applies to it too.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconciler
  namespace: ai-test-system
  labels:
    app.kubernetes.io/name: parallel-ai-test-gateway
    app.kubernetes.io/component: reconciler
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: parallel-ai-test-gateway
            app.kubernetes.io/component: reconciler
            app.kubernetes.io/part-of: parallel-ai-test-orchestrator
        spec:
          serviceAccountName: gateway
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconciler
              image: parallel-ai-test-gateway:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "app.reconcile"]
              env:
                - name: JOB_LAUNCHER_BACKEND
                  value: kubernetes
                - name: KUBERNETES_RUNNER_NAMESPACE
                  value: ai-test-runners
                - name: ARTIFACT_ROOT
                  value: /var/lib/ai-test/artifacts
                - name: RUNNER_ACTIVE_DEADLINE_SECONDS
                  value: "1800"
                - name: RECONCILE_GRACE_SECONDS
                  value: "300"
                - name: WAITING_FOR_CODE_TTL_SECONDS
                  value: "86400"
                - name: ARTIFACT_RETENTION_DAYS
                  value: "30"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ai-test-gateway
                      key: database-url
                - name: GATEWAY_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: ai-test-gateway
                      key: api-token
                - name: GATEWAY_CODEX_RUNNER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: ai-test-gateway
                      key: codex-runner-token
                - name: GATEWAY_TEST_RUNNER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: ai-test-gateway
                      key: test-runner-token
                - name: ARTIFACT_SIGNING_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ai-test-gateway
                      key: artifact-signing-key
                - name: COMPLETION_WEBHOOK_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ai-test-gateway
                      key: completion-webhook-secret
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: artifacts
                  mountPath: /var/lib/ai-test/artifacts
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: artifacts
              persistentVolumeClaim:
                claimName: ai-test-artifacts
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
