# Shape reference only - NOT part of kustomization.yaml and never applied with
# real values from this repository. Every value below is empty on purpose;
# create the real Secrets with `kubectl create secret generic` (see
# docs/operations.md) or a sealed/external secret controller.
#
# The separation rules this file encodes:
#   * The model credential (ai-test-codex-auth) exists only in ai-test-runners
#     and is mounted only by prepare/generate Jobs. A test Job never sees it.
#   * Callback tokens are per workload type, so one can be rotated or revoked
#     without taking the other workload down. The gateway holds both.
#   * The read-only clone credential is separate from the bot credential that
#     opens pull requests. The bot credential belongs to n8n and must never be
#     created in ai-test-runners.
apiVersion: v1
kind: Secret
metadata:
  name: ai-test-gateway
  namespace: ai-test-system
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
type: Opaque
stringData:
  database-url: ""
  api-token: ""
  codex-runner-token: ""
  test-runner-token: ""
  artifact-signing-key: ""
  completion-webhook-secret: ""
  github-read-token: ""
---
# Callback token for prepare/generate Jobs. Mirrors ai-test-gateway's
# codex-runner-token.
apiVersion: v1
kind: Secret
metadata:
  name: ai-test-codex-callback
  namespace: ai-test-runners
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
type: Opaque
stringData:
  token: ""
---
# Callback token for test Jobs. Mirrors ai-test-gateway's test-runner-token.
apiVersion: v1
kind: Secret
metadata:
  name: ai-test-test-callback
  namespace: ai-test-runners
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
type: Opaque
stringData:
  token: ""
---
# Model credential. Referenced only by the prepare and generate Job templates.
apiVersion: v1
kind: Secret
metadata:
  name: ai-test-codex-auth
  namespace: ai-test-runners
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
type: Opaque
stringData:
  api-key: ""
---
# Read-only clone credential. It is mounted only by the short-lived clone init
# container; the Codex and test runner containers receive a pre-cloned
# workspace and never inherit this token. It must stay distinct from the
# pull-request bot identity.
apiVersion: v1
kind: Secret
metadata:
  name: ai-test-git-read
  namespace: ai-test-runners
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
type: Opaque
stringData:
  token: ""
