apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-database-migration
  namespace: ai-test-system
  labels:
    app.kubernetes.io/name: parallel-ai-test-gateway
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parallel-ai-test-gateway
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/part-of: parallel-ai-test-orchestrator
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Replaced by CI with the same immutable tag as the gateway.
          image: parallel-ai-test-gateway:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-test-gateway
                  key: database-url
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
