# Binds the single gateway identity from ai-test-system into ai-test-runners.
# The runner ServiceAccounts are intentionally absent from every binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-runner-job-manager
  namespace: ai-test-runners
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
subjects:
  - kind: ServiceAccount
    name: gateway
    namespace: ai-test-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runner-job-manager
